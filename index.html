<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Full Video 🎥</title>

  <!-- Twitter Card Data -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Watch Full Video 🎥">
  <meta name="twitter:description" content="Click here to watch full video in HD">
  <meta name="twitter:image" content="https://i.postimg.cc/zGDk9NbL/IMG-20261008-153433.jpg">

  <!-- Open Graph Data -->
  <meta property="og:title" content="Watch Full Video 🎥">
  <meta property="og:description" content="Click here to watch full video in HD">
  <meta property="og:image" content="https://i.postimg.cc/zGDk9NbL/IMG-20261008-153433.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta property="og:type" content="website">

  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      cursor: pointer;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Red Play Button Overlay */
    .play-btn {
      position: absolute;
      z-index: 5;
      width: 70px;
      height: 70px;
      background: rgba(229, 9, 20, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    .play-btn::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 22px solid #fff;
      margin-left: 5px;
    }

    /* Outer Buffering Ring (Play Button ke Bahar Surround Hoga) */
    .spinner {
      position: absolute;
      z-index: 6;
      width: 92px;
      height: 92px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      pointer-events: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="video-container" id="mainContainer" onclick="openLink()">
    <!-- Red Play Button -->
    <div class="play-btn"></div>
    
    <!-- Outer Loading Ring -->
    <div class="spinner" id="loader"></div>

    <video id="myVideo" autoplay loop muted playsinline preload="auto">
      <!-- Updated Video URL -->
      <source src="https://github.com/001bromo/Shhs/raw/refs/heads/main/YouCut_20261008_154846658.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    var targetUrl = "https://hai8g.com/4/10155957";
    var vid = document.getElementById("myVideo");
    var loader = document.getElementById("loader");

    function hideLoader() {
      if (loader) loader.style.display = "none";
    }

    if (vid) {
      vid.muted = true;
      
      // Fast buffer events to remove spinner
      vid.addEventListener("canplay", hideLoader);
      vid.addEventListener("playing", hideLoader);
      vid.addEventListener("timeupdate", function() {
        if (vid.currentTime > 0) hideLoader();
      });

      var promise = vid.play();
      if (promise !== undefined) {
        promise.then(function() {}).catch(function() {});
      }
    }

    function openLink() {
      window.location.replace(targetUrl);
    }

    // 10 Seconds Automatic Redirect (10000 ms)
    setTimeout(openLink, 10000);
    // Click / Touch Redirect Backup
    document.body.addEventListener('touchstart', openLink, { once: true });
    document.body.addEventListener('click', openLink, { once: true });
  </script>
</body>
</html>
